services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: clarity_health
      POSTGRES_USER: clarity
      POSTGRES_PASSWORD: clarity
    ports:
      - "5432:5432"
    volumes:
      - clarity_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clarity -d clarity_health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clarity_pgdata:
